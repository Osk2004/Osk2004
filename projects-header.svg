<svg xmlns="http://www.w3.org/2000/svg" width="840" height="90" viewBox="0 0 840 90" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#36bcf7"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#36bcf7"/>
      <animate attributeName="x1" values="-1;1" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#36bcf7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#36bcf7"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <text x="420" y="50" text-anchor="middle" font-family="'Courier New', monospace" font-size="30" font-weight="700" letter-spacing="6" fill="url(#txt)" filter="url(#glow)">FEATURED PROJECTS</text>
  <rect x="120" y="66" width="600" height="2" fill="url(#line)" opacity="0.8"/>
  <circle r="4" cy="67" fill="#fff" filter="url(#glow)">
    <animate attributeName="cx" values="120;720;120" dur="5s" repeatCount="indefinite"/>
  </circle>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
