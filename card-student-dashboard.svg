<svg xmlns="http://www.w3.org/2000/svg" width="840" height="260" viewBox="0 0 840 260" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#150f26"/>
    </linearGradient>
    <linearGradient id="bd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.5" stop-color="#36bcf7"/>
      <stop offset="1" stop-color="#4ade80"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="360 0.5 0.5" to="0 0.5 0.5" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#36bcf7"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#241d3a" stroke-width="0.6"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect x="2" y="2" width="836" height="256" rx="16"/></clipPath>
  </defs>

  <rect x="1" y="1" width="838" height="258" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="838" height="258" rx="16" fill="url(#grid)" opacity="0.7"/>
  <g clip-path="url(#clip)">
    <rect x="-40" y="0" width="40" height="260" fill="#a78bfa" opacity="0.06">
      <animate attributeName="x" values="-40;840" dur="5s" repeatCount="indefinite"/>
    </rect>
    <circle cx="780" cy="30" r="90" fill="#a78bfa" opacity="0.06">
      <animate attributeName="opacity" values="0.04;0.12;0.04" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>
  <rect x="1" y="1" width="838" height="258" rx="16" fill="none" stroke="url(#bd)" stroke-width="2"/>

  <!-- Left: text -->
  <text x="36" y="52" font-family="'Courier New', monospace" font-size="12" letter-spacing="3" fill="#a78bfa">PROJECT 02
    <animate attributeName="opacity" values="1;0.5;1" dur="2.5s" repeatCount="indefinite"/>
  </text>
  <text x="36" y="92" font-family="'Segoe UI', Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">Student Performance</text>
  <text x="36" y="122" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#8b98a9">Interactive Tableau dashboard for exploring</text>
  <text x="36" y="142" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#8b98a9">student performance with visual analytics.</text>

  <g font-family="'Courier New', monospace" font-size="12" font-weight="700">
    <rect x="36" y="172" width="78" height="26" rx="13" fill="#a78bfa" fill-opacity="0.15" stroke="#a78bfa"/>
    <text x="75" y="189" text-anchor="middle" fill="#a78bfa">Tableau</text>
    <rect x="124" y="172" width="96" height="26" rx="13" fill="#36bcf7" fill-opacity="0.15" stroke="#36bcf7"/>
    <text x="172" y="189" text-anchor="middle" fill="#36bcf7">Data Viz</text>
    <rect x="230" y="172" width="104" height="26" rx="13" fill="#4ade80" fill-opacity="0.15" stroke="#4ade80"/>
    <text x="282" y="189" text-anchor="middle" fill="#4ade80">Dashboard</text>
  </g>
  <text x="36" y="232" font-family="'Courier New', monospace" font-size="12" fill="#5c6b80">github.com/Osk2004/Interactive-Student-Performance-Visualization-Using-Tableau</text>

  <!-- Right: animated chart -->
  <text x="645" y="48" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" letter-spacing="3" fill="#5c6b80">LIVE DASHBOARD PREVIEW</text>
  <path d="M480 200 H810" stroke="#2a3648" stroke-width="2"/>
  <path d="M480 150 H810 M480 100 H810 M480 60 H810" stroke="#1f2a3a" stroke-dasharray="3 5"/>

  <g fill="url(#bar)">
    <rect x="490" width="30" rx="4" y="200" height="0">
      <animate attributeName="y" values="200;130;130;200" keyTimes="0;0.25;0.85;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="height" values="0;70;70;0" keyTimes="0;0.25;0.85;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="542" width="30" rx="4" y="200" height="0">
      <animate attributeName="y" values="200;90;90;200" keyTimes="0;0.25;0.85;1" dur="6s" begin="0.15s" repeatCount="indefinite"/>
      <animate attributeName="height" values="0;110;110;0" keyTimes="0;0.25;0.85;1" dur="6s" begin="0.15s" repeatCount="indefinite"/>
    </rect>
    <rect x="594" width="30" rx="4" y="200" height="0">
      <animate attributeName="y" values="200;110;110;200" keyTimes="0;0.25;0.85;1" dur="6s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="height" values="0;90;90;0" keyTimes="0;0.25;0.85;1" dur="6s" begin="0.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="646" width="30" rx="4" y="200" height="0">
      <animate attributeName="y" values="200;60;60;200" keyTimes="0;0.25;0.85;1" dur="6s" begin="0.45s" repeatCount="indefinite"/>
      <animate attributeName="height" values="0;140;140;0" keyTimes="0;0.25;0.85;1" dur="6s" begin="0.45s" repeatCount="indefinite"/>
    </rect>
    <rect x="698" width="30" rx="4" y="200" height="0">
      <animate attributeName="y" values="200;80;80;200" keyTimes="0;0.25;0.85;1" dur="6s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="height" values="0;120;120;0" keyTimes="0;0.25;0.85;1" dur="6s" begin="0.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="750" width="30" rx="4" y="200" height="0">
      <animate attributeName="y" values="200;50;50;200" keyTimes="0;0.25;0.85;1" dur="6s" begin="0.75s" repeatCount="indefinite"/>
      <animate attributeName="height" values="0;150;150;0" keyTimes="0;0.25;0.85;1" dur="6s" begin="0.75s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Trend line -->
  <polyline points="505,118 557,78 609,98 661,48 713,68 765,38" fill="none" stroke="#4ade80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" pathLength="100" stroke-dasharray="100" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" values="100;0;0;100" keyTimes="0;0.35;0.85;1" dur="6s" repeatCount="indefinite"/>
  </polyline>
  <circle r="5" fill="#fff" filter="url(#glow)">
    <animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;1;1;0" keyTimes="0;0.35;0.85;1" calcMode="linear" path="M505 118 L557 78 L609 98 L661 48 L713 68 L765 38"/>
  </circle>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
