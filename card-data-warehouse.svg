<svg xmlns="http://www.w3.org/2000/svg" width="840" height="260" viewBox="0 0 840 260" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0b1a2b"/>
    </linearGradient>
    <linearGradient id="bd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#36bcf7"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#e8b931"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 0.5 0.5" to="360 0.5 0.5" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1f2a3a" stroke-width="0.6"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect x="2" y="2" width="836" height="256" rx="16"/></clipPath>
  </defs>

  <rect x="1" y="1" width="838" height="258" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="838" height="258" rx="16" fill="url(#grid)" opacity="0.7"/>
  <g clip-path="url(#clip)">
    <rect x="0" y="-40" width="840" height="40" fill="#36bcf7" opacity="0.06">
      <animate attributeName="y" values="-40;260" dur="4s" repeatCount="indefinite"/>
    </rect>
    <circle cx="60" cy="40" r="90" fill="#36bcf7" opacity="0.06">
      <animate attributeName="opacity" values="0.04;0.12;0.04" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>
  <rect x="1" y="1" width="838" height="258" rx="16" fill="none" stroke="url(#bd)" stroke-width="2"/>

  <!-- Left: text -->
  <text x="36" y="52" font-family="'Courier New', monospace" font-size="12" letter-spacing="3" fill="#36bcf7">PROJECT 01
    <animate attributeName="opacity" values="1;0.5;1" dur="2.5s" repeatCount="indefinite"/>
  </text>
  <text x="36" y="92" font-family="'Segoe UI', Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">SQL Data Warehouse</text>
  <text x="36" y="122" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#8b98a9">Modern warehouse on SQL Server with ETL,</text>
  <text x="36" y="142" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#8b98a9">data modeling and analytics using Medallion Architecture.</text>

  <g font-family="'Courier New', monospace" font-size="12" font-weight="700">
    <rect x="36" y="172" width="64" height="26" rx="13" fill="#36bcf7" fill-opacity="0.15" stroke="#36bcf7"/>
    <text x="68" y="189" text-anchor="middle" fill="#36bcf7">T-SQL</text>
    <rect x="110" y="172" width="104" height="26" rx="13" fill="#a78bfa" fill-opacity="0.15" stroke="#a78bfa"/>
    <text x="162" y="189" text-anchor="middle" fill="#a78bfa">SQL Server</text>
    <rect x="224" y="172" width="52" height="26" rx="13" fill="#e8b931" fill-opacity="0.15" stroke="#e8b931"/>
    <text x="250" y="189" text-anchor="middle" fill="#e8b931">ETL</text>
    <rect x="286" y="172" width="96" height="26" rx="13" fill="#4ade80" fill-opacity="0.15" stroke="#4ade80"/>
    <text x="334" y="189" text-anchor="middle" fill="#4ade80">Medallion</text>
  </g>
  <text x="36" y="232" font-family="'Courier New', monospace" font-size="12" fill="#5c6b80">github.com/Osk2004/sql-data-warehouse-project</text>

  <!-- Right: pipeline -->
  <text x="645" y="60" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" letter-spacing="3" fill="#5c6b80">MEDALLION PIPELINE</text>

  <path id="flow" d="M480 130 L810 130" stroke="#2a3648" stroke-width="2" stroke-dasharray="4 4" fill="none"/>

  <g font-family="'Courier New', monospace" font-size="13" font-weight="700" text-anchor="middle">
    <rect x="480" y="100" width="90" height="60" rx="10" fill="#1a120d" stroke="#d98c5f" stroke-width="2">
      <animate attributeName="stroke-opacity" values="1;0.4;1" dur="2.4s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <text x="525" y="126" fill="#d98c5f">BRONZE</text>
    <text x="525" y="146" font-size="10" font-weight="400" fill="#8b98a9">raw</text>

    <rect x="600" y="100" width="90" height="60" rx="10" fill="#14181f" stroke="#c0c6d0" stroke-width="2">
      <animate attributeName="stroke-opacity" values="1;0.4;1" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
    </rect>
    <text x="645" y="126" fill="#c0c6d0">SILVER</text>
    <text x="645" y="146" font-size="10" font-weight="400" fill="#8b98a9">clean</text>

    <rect x="720" y="100" width="90" height="60" rx="10" fill="#1d1707" stroke="#e8b931" stroke-width="2">
      <animate attributeName="stroke-opacity" values="1;0.4;1" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
    </rect>
    <text x="765" y="126" fill="#e8b931">GOLD</text>
    <text x="765" y="146" font-size="10" font-weight="400" fill="#8b98a9">star schema</text>
  </g>

  <!-- Data packets -->
  <circle r="5" fill="#36bcf7" filter="url(#glow)">
    <animateMotion dur="3s" begin="0s" repeatCount="indefinite" path="M480 130 L810 130"/>
  </circle>
  <circle r="5" fill="#a78bfa" filter="url(#glow)">
    <animateMotion dur="3s" begin="1s" repeatCount="indefinite" path="M480 130 L810 130"/>
  </circle>
  <circle r="5" fill="#4ade80" filter="url(#glow)">
    <animateMotion dur="3s" begin="2s" repeatCount="indefinite" path="M480 130 L810 130"/>
  </circle>

  <!-- Output chips -->
  <g font-family="'Courier New', monospace" font-size="10" font-weight="700" text-anchor="middle" fill="#e8b931">
    <rect x="600" y="192" width="90" height="24" rx="6" fill="none" stroke="#e8b931" stroke-opacity="0.6"/>
    <text x="645" y="208">DASHBOARDS</text>
    <rect x="705" y="192" width="70" height="24" rx="6" fill="none" stroke="#e8b931" stroke-opacity="0.6"/>
    <text x="740" y="208">REPORTS</text>
    <path d="M765 160 V192" stroke="#e8b931" stroke-dasharray="3 3" stroke-opacity="0.6"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
